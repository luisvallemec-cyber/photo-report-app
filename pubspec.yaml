name: photo_report_app

description: A Flutter application for photo reporting.

environment:
  sdk: ">=2.16.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  navigator: ^1.0.0
  image_picker: ^0.8.3
  path_provider: ^2.0.10
  http: ^0.13.3
  sqflite: ^2.0.0+4
  shared_preferences: ^2.0.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/